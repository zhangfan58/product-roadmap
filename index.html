<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品迭代计划看板</title>
  <style>
    :root {
      --bg: #f0f2f7;
      --surface: #ffffff;
      --border: #e2e6f0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-mid: #dbeafe;
      --accent: #3b82f6;
      --text: #111827;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --radius-sm: 8px;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(37,99,235,0.08);
      --shadow-hover: 0 8px 32px rgba(37,99,235,0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(0,0,0,0.04);
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-title { font-size: 17px; font-weight: 700; color: var(--primary); letter-spacing: -.3px; }
    .header-sub   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .header-clock { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    /* ── Main ── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Section ── */
    .section { margin-bottom: 48px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      letter-spacing: 1px; text-transform: uppercase;
    }
    .section-line {
      flex: 1; height: 1px; background: var(--border);
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      padding: 24px 22px 20px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex; flex-direction: column; gap: 14px;
      transition: all .22s cubic-bezier(.16,1,.3,1);
      box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .card::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--c, #2563eb), #60a5fa);
      opacity: 0; transition: opacity .2s;
    }
    .card:hover {
      border-color: var(--primary-mid);
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
    }
    .card:hover::after { opacity: 1; }

    .card-head { display: flex; align-items: flex-start; gap: 14px; }
    .card-icon {
      width: 48px; height: 48px; border-radius: 13px;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      transition: transform .2s;
    }
    .card:hover .card-icon { transform: scale(1.08); }

    .card-meta { flex: 1; min-width: 0; padding-top: 2px; }
    .card-name {
      font-size: 15px; font-weight: 700; line-height: 1.35;
      color: var(--text);
    }
    .card-desc {
      font-size: 12px; color: var(--text-muted);
      margin-top: 5px; line-height: 1.6;
    }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .card-tag {
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
      background: var(--primary-light); color: var(--primary);
    }
    .card-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-light); font-weight: 500;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .card-arrow {
      font-size: 15px; color: var(--text-light);
      transition: transform .2s, color .2s;
    }
    .card:hover .card-arrow { transform: translateX(5px); color: var(--primary); }

    /* ── Search ── */
    .search-wrap {
      margin-bottom: 32px;
    }
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 16px;
      transition: border .15s, box-shadow .15s;
      max-width: 380px;
    }
    .search-bar:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.08);
    }
    .search-icon { color: var(--text-muted); font-size: 14px; flex-shrink: 0; }
    .search-input {
      flex: 1; border: none; outline: none;
      font-size: 13px; color: var(--text);
      background: transparent; font-family: inherit;
    }
    .search-input::placeholder { color: var(--text-light); }

    /* ── Empty ── */
    .empty {
      text-align: center; padding: 60px 24px;
      color: var(--text-muted); font-size: 13px;
    }
    .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: .4; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .header { padding: 0 16px; }
      .main   { padding: 24px 12px 60px; }
      .header-clock { display: none; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="header-icon">🗂</div>
    <div>
      <div class="header-title">产品迭代计划看板</div>
      <div class="header-sub">Product Roadmap · NAS</div>
    </div>
  </div>
  <div class="header-clock" id="clock"></div>
</div>

<div class="main">
  <div class="search-wrap">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" placeholder="搜索项目名称或分类…" oninput="renderAll()" />
    </div>
  </div>
  <div id="root"></div>
</div>

<script>
// ════════════════════════════════════════════════════
// 项目数据配置
// 新增项目：在对应分组的 items 里加一条记录
// 字段说明：
//   name   - 项目名称
//   desc   - 简介
//   icon   - emoji 图标
//   url    - 点击跳转的链接（极空间分享链接 / 任意网址）
//   tag    - 分类标签
//   color  - 卡片顶部强调色
//   status - active(进行中) / done(已完成) / plan(规划中)
// ════════════════════════════════════════════════════
const GROUPS = [
  {
    label: '门锁产品线',
    items: [
      {
        name:   '门锁 SKU 需求看板',
        desc:   '各 SKU 版本需求管理，版本节点时间、优先级、拖拽排序',
        icon:   '🔐',
        url:    'https://t3.znas.cn/DLx49aCWxMh',
        tag:    '硬件·门锁',
        color:  '#2563eb',
        status: 'active',
      },
      // ── 在此处继续添加门锁产品线的项目 ──
    ],
  },
  // ── 新增产品线示例（删除注释即可启用）──
  // {
  //   label: '其他产品线',
  //   items: [
  //     {
  //       name:   '示例项目',
  //       desc:   '项目简介',
  //       icon:   '📦',
  //       url:    'https://t3.znas.cn/xxxxxxxx',
  //       tag:    '分类',
  //       color:  '#10b981',
  //       status: 'plan',
  //     },
  //   ],
  // },
];

// ════════════════════════════════════════════════════
// 状态配置
// ════════════════════════════════════════════════════
const STATUS_MAP = {
  active: { label: '进行中', color: '#10b981' },
  done:   { label: '已完成', color: '#6b7280' },
  plan:   { label: '规划中', color: '#f59e0b' },
};

// ════════════════════════════════════════════════════
// 渲染
// ════════════════════════════════════════════════════
function renderAll() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const root = document.getElementById('root');
  root.innerHTML = '';

  let totalVisible = 0;

  GROUPS.forEach(group => {
    const items = q
      ? group.items.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.desc.toLowerCase().includes(q) ||
          p.tag.toLowerCase().includes(q))
      : group.items;

    if (items.length === 0) return;
    totalVisible += items.length;

    const section = document.createElement('div');
    section.className = 'section';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <span class="section-label">${esc(group.label)}</span>
      <span class="section-line"></span>
    `;

    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(p => grid.appendChild(buildCard(p)));

    section.appendChild(header);
    section.appendChild(grid);
    root.appendChild(section);
  });

  if (totalVisible === 0) {
    root.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div>没有找到匹配的项目</div>
      </div>`;
  }
}

function buildCard(p) {
  const st = STATUS_MAP[p.status] || STATUS_MAP.active;
  const a = document.createElement('a');
  a.className = 'card';
  a.href = p.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.style.setProperty('--c', p.color || '#2563eb');
  a.innerHTML = `
    <div class="card-head">
      <div class="card-icon">${p.icon}</div>
      <div class="card-meta">
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-desc">${esc(p.desc)}</div>
      </div>
    </div>
    <div class="card-footer">
      <span class="card-tag">${esc(p.tag)}</span>
      <span class="card-status">
        <span class="status-dot" style="background:${st.color}"></span>
        ${st.label}
      </span>
      <span class="card-arrow">→</span>
    </div>
  `;
  return a;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════════════════
// 时钟
// ════════════════════════════════════════════════════
function tick() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('clock').textContent =
    `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${days[d.getDay()]} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
tick(); setInterval(tick, 1000);

// ════════════════════════════════════════════════════
// 启动
// ════════════════════════════════════════════════════
renderAll();
</script>
</body>
</html>
