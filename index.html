<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目看板导航</title>
  <style>
    /* ── 全局变量 ── */
    :root {
      --bg: #f0f2f7;
      --surface: #ffffff;
      --surface2: #f8f9fc;
      --border: #e2e6f0;
      --border-light: #f0f2f7;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-mid: #dbeafe;
      --accent: #3b82f6;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --text: #111827;
      --text-secondary: #374151;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --radius-sm: 6px;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow-xs: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 16px rgba(37,99,235,0.08);
      --shadow-md: 0 8px 24px rgba(37,99,235,0.12);
      --shadow-lg: 0 16px 48px rgba(37,99,235,0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── 通用 Header ── */
    .app-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 0 var(--border), var(--shadow-xs);
    }
    .header-left  { display: flex; align-items: center; gap: 12px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .header-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .header-title { font-size: 18px; font-weight: 700; color: var(--primary); letter-spacing: -.3px; }
    .header-sub   { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .header-clock { font-size: 12px; color: var(--text-muted); }

    /* ── 通用按钮 ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: var(--radius-sm); border: none;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all .18s;
      letter-spacing: .1px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.3);
    }
    .btn-primary:hover { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); }
    .btn-ghost {
      background: #fff; color: var(--primary);
      border: 1.5px solid var(--primary-mid);
    }
    .btn-ghost:hover { background: var(--primary-light); border-color: var(--primary); }
    .btn-back {
      background: var(--surface2); color: var(--text-muted);
      border: 1.5px solid var(--border); font-size: 13px;
    }
    .btn-back:hover { background: #fff; color: var(--primary); border-color: var(--primary-mid); }

    /* ════════════════════════════════
       视图切换
    ════════════════════════════════ */
    .view { display: none; }
    .view.active { display: block; }

    /* ════════════════════════════════
       VIEW: Launcher
    ════════════════════════════════ */
    #view-launcher .main {
      max-width: 1100px; margin: 0 auto;
      padding: 36px 24px 64px;
    }
    .section-title {
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      letter-spacing: .8px; text-transform: uppercase; margin-bottom: 16px;
    }
    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .launcher-card {
      background: #fff; border-radius: var(--radius-lg);
      border: 1.5px solid var(--border);
      padding: 22px 22px 18px;
      cursor: pointer;
      display: flex; flex-direction: column; gap: 12px;
      transition: all .2s cubic-bezier(.16,1,.3,1);
      box-shadow: var(--shadow);
      position: relative; overflow: hidden;
      user-select: none;
    }
    .launcher-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--card-color, #2563eb), #3b82f6);
      opacity: 0; transition: opacity .2s;
    }
    .launcher-card:hover { border-color: var(--primary-mid); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .launcher-card:hover::before { opacity: 1; }
    .lc-head { display: flex; align-items: flex-start; gap: 12px; }
    .lc-emoji {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .lc-info { flex: 1; min-width: 0; }
    .lc-name { font-size: 15px; font-weight: 700; line-height: 1.4; }
    .lc-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
    .lc-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .lc-tag {
      font-size: 11px; font-weight: 600; padding: 3px 9px;
      border-radius: 20px; background: var(--primary-light); color: var(--primary);
    }
    .lc-arrow { font-size: 16px; color: var(--text-light); transition: transform .2s, color .2s; }
    .launcher-card:hover .lc-arrow { transform: translateX(4px); color: var(--primary); }

    /* search */
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 14px;
      margin-bottom: 24px; transition: border .15s;
    }
    .search-bar:focus-within { border-color: var(--primary); }
    .search-icon { color: var(--text-muted); font-size: 14px; }
    .search-input {
      flex: 1; border: none; outline: none; font-size: 13px;
      color: var(--text); background: transparent; font-family: inherit;
    }
    .search-input::placeholder { color: var(--text-light); }

    /* ════════════════════════════════
       VIEW: 门锁看板 (内嵌)
    ════════════════════════════════ */
    #view-kanban { background: var(--bg); }

    /* Board */
    .board {
      padding: 28px 32px 48px;
      display: flex; gap: 20px; align-items: flex-start;
      overflow-x: auto;
      min-height: calc(100vh - 64px);
    }
    .board::-webkit-scrollbar { height: 6px; }
    .board::-webkit-scrollbar-track { background: transparent; }
    .board::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* SKU Column */
    .sku-col {
      flex-shrink: 0; width: 320px;
      background: #fff; border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: flex; flex-direction: column;
      box-shadow: var(--shadow);
      max-height: calc(100vh - 116px); overflow: hidden;
      transition: box-shadow .2s, border-color .2s;
    }
    .sku-col:hover { box-shadow: var(--shadow-md); border-color: var(--primary-mid); }

    .sku-col-header {
      padding: 0; background: #fff;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      flex-shrink: 0; border-bottom: 2px solid var(--primary-light);
    }
    .sku-col-title-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 20px 20px 14px; position: relative;
    }
    .sku-col-name {
      font-size: 17px; font-weight: 800; color: var(--primary);
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: default; letter-spacing: -.2px; line-height: 1.3;
    }
    .sku-col-name:hover { color: var(--primary-dark); }
    .sku-name-input {
      flex: 1; min-width: 0; background: var(--primary-light); border: none;
      border-bottom: 2px solid var(--primary); border-radius: 4px 4px 0 0;
      outline: none; font-size: 17px; font-weight: 800;
      color: var(--primary); font-family: inherit; padding: 2px 6px;
    }
    .sku-col-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .sku-icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 14px;
      border-radius: var(--radius-sm); padding: 3px 7px;
      transition: all .15s; line-height: 1;
    }
    .sku-icon-btn:hover     { background: var(--primary-light); color: var(--primary); }
    .sku-icon-btn.del:hover { background: var(--danger-light);  color: var(--danger);  }

    .sku-version-row {
      display: flex; align-items: center; gap: 6px;
      padding: 0 20px; margin-bottom: 12px;
    }
    .version-select {
      flex: 1; padding: 5px 10px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--primary-mid); background: var(--primary-light);
      font-size: 12px; font-weight: 600; color: var(--primary);
      cursor: pointer; outline: none; font-family: inherit;
    }
    .version-select:focus { border-color: var(--primary); }
    .version-add-btn {
      padding: 4px 9px; border-radius: var(--radius-sm);
      border: 1.5px dashed var(--border); background: transparent;
      font-size: 11px; color: var(--text-muted); cursor: pointer;
      transition: all .15s; white-space: nowrap; font-weight: 500;
    }
    .version-add-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .version-edit-btn {
      padding: 4px 9px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--primary-mid); background: #fff;
      font-size: 11px; font-weight: 500; color: var(--primary);
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .version-edit-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    .ver-milestones {
      display: flex; flex-direction: column; gap: 7px;
      background: var(--surface2); border-radius: var(--radius-sm);
      padding: 12px 14px; margin: 0 20px 18px;
      border: 1px solid var(--border-light);
    }
    .ver-milestone { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .ver-milestone-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .ver-milestone-label { color: var(--text-muted); flex-shrink: 0; min-width: 38px; }
    .ver-milestone-date  { font-weight: 600; color: var(--text-secondary); }
    .ver-milestone-empty { color: var(--text-light); }

    .sku-col-body {
      padding: 14px 20px; overflow-y: auto; flex: 1;
      display: flex; flex-direction: column; gap: 10px;
    }
    .sku-col-body::-webkit-scrollbar { width: 4px; }
    .sku-col-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .col-add-btn {
      margin: 2px 20px 18px; padding: 9px;
      border: 1.5px dashed var(--primary-mid); border-radius: var(--radius-sm);
      background: transparent; color: var(--primary);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: all .18s; text-align: center; flex-shrink: 0;
    }
    .col-add-btn:hover { border-color: var(--primary); background: var(--primary-light); }

    .add-sku-col {
      flex-shrink: 0; width: 180px;
      border: 2px dashed var(--border); border-radius: var(--radius-lg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      padding: 32px 16px; cursor: pointer; transition: all .2s;
      color: var(--text-muted); background: #fff; min-height: 200px;
    }
    .add-sku-col:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); box-shadow: var(--shadow); }
    .add-sku-col .plus  { font-size: 32px; line-height: 1; font-weight: 300; }
    .add-sku-col .label { font-size: 13px; font-weight: 600; }

    /* Card */
    .card {
      background: #fff; border-radius: 8px;
      border: 1.5px solid var(--border);
      padding: 14px 16px; cursor: grab;
      transition: box-shadow .18s, border-color .18s, transform .12s;
    }
    .card:hover { box-shadow: var(--shadow); border-color: var(--primary-mid); transform: translateY(-1px); }
    .card.dragging { opacity: .55; box-shadow: var(--shadow-lg); cursor: grabbing; transform: rotate(1deg) scale(1.02); }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 600; line-height: 1.6; flex: 1; word-break: break-all; color: var(--text); }
    .card-actions { display: flex; gap: 3px; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
    .card:hover .card-actions { opacity: 1; }
    .card-action-btn {
      background: var(--surface2); border: none; cursor: pointer;
      border-radius: 4px; padding: 3px 7px; font-size: 11px;
      color: var(--text-muted); transition: all .15s; font-weight: 500;
    }
    .card-action-btn:hover     { background: var(--primary-light); color: var(--primary); }
    .card-action-btn.del:hover { background: var(--danger-light);  color: var(--danger);  }

    .card-link {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 8px; font-size: 11px; color: var(--primary);
      text-decoration: none; max-width: 100%;
      padding: 4px 9px; border-radius: 4px;
      background: var(--primary-light); border: 1px solid var(--primary-mid);
      transition: all .15s; overflow: hidden;
    }
    .card-link:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .card-link .link-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }

    .card-meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .priority-tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; letter-spacing: .4px; }
    .priority-high { background: var(--danger-light);  color: var(--danger);  }
    .priority-mid  { background: var(--warning-light); color: var(--warning); }
    .priority-low  { background: var(--success-light); color: var(--success); }

    .due-badge { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 3px; font-weight: 500; }
    .due-badge.overdue { color: var(--danger);  font-weight: 700; }
    .due-badge.soon    { color: var(--warning); font-weight: 700; }

    .card-desc {
      margin-top: 8px; font-size: 11.5px; color: var(--text-muted);
      line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-placeholder {
      border: 2px dashed var(--primary); border-radius: var(--radius-sm);
      background: var(--primary-light); height: 64px; flex-shrink: 0;
    }
    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 12px; }
    .empty-state .icon { font-size: 28px; margin-bottom: 8px; opacity: .5; }
    .empty-state p { font-weight: 500; }

    /* Modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(17,24,39,.5); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 20px;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: #fff; border-radius: var(--radius-lg);
      width: 100%; max-width: 500px;
      box-shadow: var(--shadow-lg); overflow: hidden;
      animation: slideUp .22s cubic-bezier(.16,1,.3,1);
    }
    @keyframes slideUp {
      from { transform: translateY(24px) scale(.98); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, var(--primary-light) 0%, #fff 60%);
    }
    .modal-title { font-size: 15px; font-weight: 700; color: var(--primary); }
    .modal-close {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 18px;
      border-radius: var(--radius-sm); padding: 3px 7px; transition: all .15s;
    }
    .modal-close:hover { background: var(--danger-light); color: var(--danger); }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer {
      padding: 14px 24px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px;
      background: var(--surface2);
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .form-input, .form-select, .form-textarea {
      padding: 9px 12px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      font-size: 13px; background: #fff; color: var(--text);
      outline: none; width: 100%; transition: border .15s, box-shadow .15s;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    .form-textarea { resize: vertical; min-height: 72px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     VIEW: Launcher
══════════════════════════════════════════════════════ -->
<div id="view-launcher" class="view active">
  <div class="app-header">
    <div class="header-left">
      <div class="header-icon">🗂</div>
      <div>
        <div class="header-title">项目看板导航</div>
        <div class="header-sub">Project Launcher</div>
      </div>
    </div>
    <div class="header-right">
      <span class="header-clock" id="clock"></span>
    </div>
  </div>

  <div class="main">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" placeholder="搜索项目…" oninput="filterCards()" />
    </div>
    <div class="section-title">我的项目</div>
    <div class="launcher-grid" id="launcherGrid"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     VIEW: 门锁 SKU 需求看板
══════════════════════════════════════════════════════ -->
<div id="view-kanban" class="view">

  <!-- Header -->
  <div class="app-header">
    <div class="header-left">
      <button class="btn btn-back" onclick="showLauncher()">← 返回</button>
      <div class="header-icon">🔐</div>
      <div>
        <div class="header-title">门锁需求看板</div>
        <div class="header-sub">Smart Lock PM Board</div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn btn-ghost" onclick="importData()">↑ 导入</button>
      <button class="btn btn-ghost" onclick="exportData()">↓ 导出</button>
      <button class="btn btn-primary" onclick="openAddSkuModal()">＋ 新增 SKU</button>
    </div>
  </div>

  <!-- Board -->
  <div class="board" id="board"></div>

  <!-- Modal: 新增/编辑需求 -->
  <div class="overlay hidden" id="cardOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="cardModalTitle">新增需求</div>
        <button class="modal-close" onclick="closeCardModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">需求名称 *</label>
          <input class="form-input" id="f_title" placeholder="输入需求名称" />
        </div>
        <div class="form-group">
          <label class="form-label">关联链接（可选）</label>
          <input class="form-input" id="f_link" placeholder="https://..." />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">优先级</label>
            <select class="form-select" id="f_priority">
              <option value="high">🔴 高优先级</option>
              <option value="mid" selected>🟡 中优先级</option>
              <option value="low">🟢 低优先级</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">完成时间</label>
            <input class="form-input" id="f_due" type="date" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">描述说明（可选）</label>
          <textarea class="form-textarea" id="f_desc" placeholder="简要描述需求背景或验收标准…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeCardModal()">取消</button>
        <button class="btn btn-primary" onclick="saveCard()">保存</button>
      </div>
    </div>
  </div>

  <!-- Modal: 版本节点时间 -->
  <div class="overlay hidden" id="verDateOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="verDateTitle">版本节点时间</div>
        <button class="modal-close" onclick="closeVerDateModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">🧪 提测时间</label>
          <input class="form-input" id="vd_test" type="date" />
        </div>
        <div class="form-group">
          <label class="form-label">🚀 UAT 发版时间</label>
          <input class="form-input" id="vd_uat" type="date" />
        </div>
        <div class="form-group">
          <label class="form-label">✅ 准出时间</label>
          <input class="form-input" id="vd_release" type="date" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeVerDateModal()">取消</button>
        <button class="btn btn-primary" onclick="saveVerDate()">保存</button>
      </div>
    </div>
  </div>

  <!-- Modal: 新增 SKU -->
  <div class="overlay hidden" id="skuOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">新增 SKU</div>
        <button class="modal-close" onclick="closeSkuModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">SKU 名称 *</label>
          <input class="form-input" id="sku_name" placeholder="如：ML-X200 旗舰版" />
        </div>
        <div class="form-group">
          <label class="form-label">SKU 编码（可选）</label>
          <input class="form-input" id="sku_code" placeholder="如：MLK-X200-BLK" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeSkuModal()">取消</button>
        <button class="btn btn-primary" onclick="saveSku()">添加</button>
      </div>
    </div>
  </div>

</div><!-- /view-kanban -->

<script>
// ════════════════════════════════════════════════════════
// 视图路由
// ════════════════════════════════════════════════════════
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showLauncher() { showView('view-launcher'); }
function showKanban()   { showView('view-kanban'); render(); }

// ════════════════════════════════════════════════════════
// Launcher 配置
// 新增内嵌看板：加 { name, desc, emoji, viewId: 'kanban', tag, color }
// 链接外部页面：加 { name, desc, emoji, href: './xxx/index.html', tag, color }
// ════════════════════════════════════════════════════════
const LAUNCHER_PROJECTS = [
  {
    name:  '门锁 SKU 需求看板',
    desc:  '门锁产品线各 SKU 版本需求管理，支持拖拽排序、版本节点时间',
    emoji: '🔐',
    viewId: 'kanban',
    tag:   '硬件·门锁',
    color: '#2563eb',
  },
];

function renderLauncher(list) {
  const grid = document.getElementById('launcherGrid');
  grid.innerHTML = '';
  list.forEach(p => {
    const el = document.createElement('div');
    el.className = 'launcher-card';
    el.style.setProperty('--card-color', p.color || '#2563eb');
    el.innerHTML = `
      <div class="lc-head">
        <div class="lc-emoji">${p.emoji}</div>
        <div class="lc-info">
          <div class="lc-name">${esc(p.name)}</div>
          <div class="lc-desc">${esc(p.desc)}</div>
        </div>
      </div>
      <div class="lc-footer">
        <span class="lc-tag">${esc(p.tag)}</span>
        <span class="lc-arrow">→</span>
      </div>
    `;
    el.addEventListener('click', () => {
      if (p.viewId === 'kanban')  showKanban();
      else if (p.href)            window.open(p.href, '_blank');
    });
    grid.appendChild(el);
  });
}

function filterCards() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  renderLauncher(q
    ? LAUNCHER_PROJECTS.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.desc.toLowerCase().includes(q) ||
        p.tag.toLowerCase().includes(q))
    : LAUNCHER_PROJECTS);
}

// 时钟
function updateClock() {
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('clock').textContent =
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${days[d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
updateClock(); setInterval(updateClock, 1000);

// ════════════════════════════════════════════════════════
// 看板数据层
// ════════════════════════════════════════════════════════
const STORAGE_KEY = 'lock_kanban_v3';

const DEFAULT_SKUS = [
  { id: 'sku1', name: 'ML-F10 指纹密码锁',  code: 'MLK-F10-SLV'  },
  { id: 'sku2', name: 'ML-X200 全能旗舰版', code: 'MLK-X200-BLK' },
  { id: 'sku3', name: 'ML-V5 猫眼智能锁',   code: 'MLK-V5-GLD'   },
  { id: 'sku4', name: 'ML-S1 入门款',       code: 'MLK-S1-WHT'   },
  { id: 'sku5', name: 'ML-Pro 商用版',      code: 'MLK-PRO-BLK'  },
];
const DEFAULT_VERSIONS = ['V1.0', 'V1.1', 'V2.0'];

function defaultCards(skuId, version) {
  if (skuId === 'sku1' && version === 'V1.0') {
    return [
      { id: uid(), title: '指纹录入优化',   link: '', priority: 'high', due: '2026-10-15', desc: '支持最多 100 枚指纹，录入成功率 ≥99%' },
      { id: uid(), title: 'App 远程开锁',   link: '', priority: 'mid',  due: '2026-11-01', desc: '' },
      { id: uid(), title: '低电量报警推送', link: '', priority: 'low',  due: '2026-12-01', desc: '电量低于 15% 时推送通知' },
    ];
  }
  return [];
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const skus = DEFAULT_SKUS.map(s => ({...s}));
  const versions = {}, cards = {};
  skus.forEach(s => {
    versions[s.id] = [...DEFAULT_VERSIONS];
    DEFAULT_VERSIONS.forEach(v => { cards[`${s.id}::${v}`] = defaultCards(s.id, v); });
  });
  return {
    skus, versions, cards,
    activeVersions: Object.fromEntries(skus.map(s => [s.id, DEFAULT_VERSIONS[0]])),
    versionMeta: {},
  };
}

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid()       { return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
function esc(s)      { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function skuCards(skuId) {
  const v = state.activeVersions[skuId] || (state.versions[skuId] || [])[0] || '';
  return state.cards[`${skuId}::${v}`] || [];
}
function setSkuCards(skuId, list) {
  const v = state.activeVersions[skuId];
  state.cards[`${skuId}::${v}`] = list;
}

// ════════════════════════════════════════════════════════
// 看板渲染
// ════════════════════════════════════════════════════════
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  state.skus.forEach(sku => board.appendChild(buildSkuCol(sku)));
  const addCol = document.createElement('div');
  addCol.className = 'add-sku-col';
  addCol.innerHTML = `<div class="plus">＋</div><div class="label">新增 SKU</div>`;
  addCol.onclick = openAddSkuModal;
  board.appendChild(addCol);
}

function buildSkuCol(sku) {
  const col = document.createElement('div');
  col.className = 'sku-col'; col.dataset.skuId = sku.id;

  const vers = state.versions[sku.id] || [];
  const activeVer = state.activeVersions[sku.id] || vers[0] || '';
  const cards = skuCards(sku.id);

  const header = document.createElement('div');
  header.className = 'sku-col-header';

  const titleRow = document.createElement('div');
  titleRow.className = 'sku-col-title-row';

  const nameEl = document.createElement('div');
  nameEl.className = 'sku-col-name';
  nameEl.textContent = sku.name; nameEl.title = '双击编辑名称';

  const actions = document.createElement('div');
  actions.className = 'sku-col-actions';

  const addBtn = document.createElement('button');
  addBtn.className = 'sku-icon-btn'; addBtn.title = '新增需求'; addBtn.textContent = '＋';
  addBtn.onclick = () => openAddCardModal(sku.id);

  const delBtn = document.createElement('button');
  delBtn.className = 'sku-icon-btn del'; delBtn.title = '删除 SKU'; delBtn.textContent = '×';
  delBtn.onclick = () => {
    if (state.skus.length <= 1) { alert('至少保留一个 SKU'); return; }
    if (!confirm(`确认删除 SKU「${sku.name}」及其所有需求？`)) return;
    state.skus = state.skus.filter(s => s.id !== sku.id);
    delete state.versions[sku.id]; delete state.activeVersions[sku.id];
    Object.keys(state.cards).filter(k => k.startsWith(sku.id + '::')).forEach(k => delete state.cards[k]);
    saveState(); render();
  };

  actions.appendChild(addBtn); actions.appendChild(delBtn);
  titleRow.appendChild(nameEl); titleRow.appendChild(actions);

  nameEl.addEventListener('dblclick', e => {
    e.stopPropagation();
    const input = document.createElement('input');
    input.className = 'sku-name-input'; input.value = sku.name;
    input.style.width = Math.max(80, nameEl.offsetWidth) + 'px';
    titleRow.replaceChild(input, nameEl); input.focus(); input.select();
    const commit = () => { const v = input.value.trim(); if (v) sku.name = v; saveState(); render(); };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e2 => {
      if (e2.key === 'Enter')  input.blur();
      if (e2.key === 'Escape') { input.value = sku.name; input.blur(); }
      e2.stopPropagation();
    });
  });

  const verRow = document.createElement('div');
  verRow.className = 'sku-version-row';

  const sel = document.createElement('select');
  sel.className = 'version-select';
  vers.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    if (v === activeVer) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { state.activeVersions[sku.id] = sel.value; saveState(); render(); };

  const verAddBtn = document.createElement('button');
  verAddBtn.className = 'version-add-btn'; verAddBtn.textContent = '+ 版本';
  verAddBtn.onclick = () => {
    const name = prompt('输入新版本名称（如 V2.1）：');
    if (!name || !name.trim()) return;
    if (vers.includes(name.trim())) { alert('版本已存在'); return; }
    vers.push(name.trim()); state.versions[sku.id] = vers;
    state.activeVersions[sku.id] = name.trim();
    state.cards[`${sku.id}::${name.trim()}`] = [];
    saveState(); render();
  };

  const verEditBtn = document.createElement('button');
  verEditBtn.className = 'version-edit-btn'; verEditBtn.textContent = '节点时间';
  verEditBtn.title = '编辑提测/UAT/准出时间';
  verEditBtn.onclick = () => openVerDateModal(sku.id, activeVer);

  verRow.appendChild(sel); verRow.appendChild(verAddBtn); verRow.appendChild(verEditBtn);

  const milestones = document.createElement('div');
  milestones.className = 'ver-milestones';
  const meta = (state.versionMeta || {})[`${sku.id}::${activeVer}`] || {};
  [
    { key: 'test',    dot: '#2563eb', label: '提测' },
    { key: 'uat',     dot: '#f59e0b', label: 'UAT'  },
    { key: 'release', dot: '#10b981', label: '准出' },
  ].forEach(m => {
    const row = document.createElement('div'); row.className = 'ver-milestone';
    const dot = document.createElement('span'); dot.className = 'ver-milestone-dot'; dot.style.background = m.dot;
    const lbl = document.createElement('span'); lbl.className = 'ver-milestone-label'; lbl.textContent = m.label;
    const dateEl = document.createElement('span');
    dateEl.className = meta[m.key] ? 'ver-milestone-date' : 'ver-milestone-empty';
    dateEl.textContent = meta[m.key] ? formatDateFull(meta[m.key]) : '—';
    row.appendChild(dot); row.appendChild(lbl); row.appendChild(dateEl);
    milestones.appendChild(row);
  });

  header.appendChild(titleRow); header.appendChild(verRow); header.appendChild(milestones);

  const body = document.createElement('div');
  body.className = 'sku-col-body'; body.dataset.skuId = sku.id;

  if (cards.length === 0) {
    body.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>暂无需求</p></div>`;
  } else {
    cards.forEach(card => body.appendChild(buildCardEl(card, sku.id)));
  }

  body.addEventListener('dragover', e => {
    e.preventDefault();
    const ph = document.getElementById('drag-placeholder'); if (!ph) return;
    const after = getDragAfterElement(body, e.clientY);
    if (after) body.insertBefore(ph, after); else body.appendChild(ph);
  });
  body.addEventListener('drop', e => {
    e.preventDefault();
    const cardId = e.dataTransfer.getData('cardId'), srcSkuId = e.dataTransfer.getData('skuId');
    if (srcSkuId !== sku.id) return;
    const allCards = skuCards(sku.id), card = allCards.find(c => c.id === cardId);
    if (!card) return;
    const filtered = allCards.filter(c => c.id !== cardId);
    const after = getDragAfterElement(body, e.clientY);
    let idx = after && after.dataset.cardId ? filtered.findIndex(c => c.id === after.dataset.cardId) : -1;
    if (idx === -1) idx = filtered.length;
    filtered.splice(idx, 0, card); setSkuCards(sku.id, filtered); saveState(); render();
  });
  body.addEventListener('dragleave', e => {
    if (!body.contains(e.relatedTarget)) { const ph = document.getElementById('drag-placeholder'); if (ph) ph.remove(); }
  });

  const colAddBtn = document.createElement('button');
  colAddBtn.className = 'col-add-btn'; colAddBtn.textContent = '＋ 添加需求';
  colAddBtn.onclick = () => openAddCardModal(sku.id);

  col.appendChild(header); col.appendChild(body); col.appendChild(colAddBtn);
  return col;
}

function buildCardEl(card, skuId) {
  const el = document.createElement('div');
  el.className = 'card'; el.draggable = true; el.dataset.cardId = card.id;

  const now = new Date(); now.setHours(0,0,0,0);
  let dueHtml = '';
  if (card.due) {
    const dueDate = new Date(card.due), diff = Math.round((dueDate - now) / 86400000);
    let cls = 'due-badge', label = formatDate(card.due);
    if (diff < 0)       { cls += ' overdue'; label = `逾期 ${-diff}d`; }
    else if (diff <= 7) { cls += ' soon';    label = diff === 0 ? '今天截止' : `${diff}天后截止`; }
    dueHtml = `<span class="${cls}">📅 ${label}</span>`;
  }
  const linkHtml = card.link
    ? `<a class="card-link" href="${esc(card.link)}" target="_blank" title="${esc(card.link)}"><span>🔗</span><span class="link-text">${esc(card.link)}</span></a>`
    : '';
  const prioMap = { high: ['high','高优'], mid: ['mid','中优'], low: ['low','低优'] };
  const [pcls, plabel] = prioMap[card.priority] || prioMap.mid;

  el.innerHTML = `
    <div class="card-top">
      <div class="card-title">${esc(card.title)}${linkHtml}</div>
      <div class="card-actions">
        <button class="card-action-btn" onclick="editCard('${skuId}','${card.id}')">编辑</button>
        <button class="card-action-btn del" onclick="deleteCard('${skuId}','${card.id}')">删除</button>
      </div>
    </div>
    <div class="card-meta">
      <span class="priority-tag priority-${pcls}">${plabel}</span>
      ${dueHtml}
    </div>
    ${card.desc ? `<div class="card-desc">${esc(card.desc)}</div>` : ''}
  `;
  el.addEventListener('mousedown', e => {
    if (e.target.closest('a')) { el.draggable = false; setTimeout(() => { el.draggable = true; }, 300); }
  });
  el.addEventListener('dragstart', e => {
    if (!el.draggable) { e.preventDefault(); return; }
    e.dataTransfer.setData('cardId', card.id); e.dataTransfer.setData('skuId', skuId);
    el.classList.add('dragging');
    const ph = document.createElement('div');
    ph.className = 'card-placeholder'; ph.id = 'drag-placeholder';
    document.body.appendChild(ph); setTimeout(() => ph.remove(), 0);
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    const ph = document.getElementById('drag-placeholder'); if (ph) ph.remove();
  });
  return el;
}

function getDragAfterElement(container, y) {
  const els = [...container.querySelectorAll('.card:not(.dragging)')];
  return els.reduce((closest, child) => {
    const box = child.getBoundingClientRect(), offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: child };
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function formatDate(str) {
  if (!str) return '';
  const d = new Date(str); return `${d.getMonth()+1}/${d.getDate()}`;
}
function formatDateFull(str) {
  if (!str) return '';
  const d = new Date(str);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ════════════════════════════════════════════════════════
// 版本节点 Modal
// ════════════════════════════════════════════════════════
let vdSkuId = null, vdVerKey = null;

function openVerDateModal(skuId, ver) {
  vdSkuId = skuId; vdVerKey = `${skuId}::${ver}`;
  if (!state.versionMeta) state.versionMeta = {};
  const meta = state.versionMeta[vdVerKey] || {};
  document.getElementById('verDateTitle').textContent = `版本节点时间 · ${ver}`;
  document.getElementById('vd_test').value    = meta.test    || '';
  document.getElementById('vd_uat').value     = meta.uat     || '';
  document.getElementById('vd_release').value = meta.release || '';
  document.getElementById('verDateOverlay').classList.remove('hidden');
}
function closeVerDateModal() {
  document.getElementById('verDateOverlay').classList.add('hidden');
  vdSkuId = null; vdVerKey = null;
}
function saveVerDate() {
  if (!state.versionMeta) state.versionMeta = {};
  state.versionMeta[vdVerKey] = {
    test:    document.getElementById('vd_test').value,
    uat:     document.getElementById('vd_uat').value,
    release: document.getElementById('vd_release').value,
  };
  saveState(); closeVerDateModal(); render();
}

// ════════════════════════════════════════════════════════
// 需求 Card Modal
// ════════════════════════════════════════════════════════
let editingCardId = null, editingSkuId = null;

function openAddCardModal(skuId) {
  editingCardId = null; editingSkuId = skuId;
  document.getElementById('cardModalTitle').textContent = '新增需求';
  ['f_title','f_link','f_due','f_desc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_priority').value = 'mid';
  document.getElementById('cardOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('f_title').focus(), 80);
}
function editCard(skuId, id) {
  const card = skuCards(skuId).find(c => c.id === id); if (!card) return;
  editingCardId = id; editingSkuId = skuId;
  document.getElementById('cardModalTitle').textContent = '编辑需求';
  document.getElementById('f_title').value    = card.title;
  document.getElementById('f_link').value     = card.link || '';
  document.getElementById('f_priority').value = card.priority;
  document.getElementById('f_due').value      = card.due || '';
  document.getElementById('f_desc').value     = card.desc || '';
  document.getElementById('cardOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('f_title').focus(), 80);
}
function closeCardModal() {
  document.getElementById('cardOverlay').classList.add('hidden');
  editingCardId = null; editingSkuId = null;
}
function saveCard() {
  const title = document.getElementById('f_title').value.trim();
  if (!title) { alert('需求名称不能为空'); return; }
  const newCard = {
    id: editingCardId || uid(), title,
    link:     document.getElementById('f_link').value.trim(),
    priority: document.getElementById('f_priority').value,
    due:      document.getElementById('f_due').value,
    desc:     document.getElementById('f_desc').value.trim(),
  };
  const cards = skuCards(editingSkuId);
  if (editingCardId) {
    const idx = cards.findIndex(c => c.id === editingCardId);
    if (idx !== -1) cards[idx] = newCard; else cards.push(newCard);
  } else { cards.push(newCard); }
  setSkuCards(editingSkuId, cards);
  saveState(); closeCardModal(); render();
}
function deleteCard(skuId, id) {
  if (!confirm('确认删除该需求？')) return;
  setSkuCards(skuId, skuCards(skuId).filter(c => c.id !== id));
  saveState(); render();
}

// ════════════════════════════════════════════════════════
// SKU Modal
// ════════════════════════════════════════════════════════
function openAddSkuModal() {
  document.getElementById('sku_name').value = '';
  document.getElementById('sku_code').value = '';
  document.getElementById('skuOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('sku_name').focus(), 80);
}
function closeSkuModal() { document.getElementById('skuOverlay').classList.add('hidden'); }
function saveSku() {
  const name = document.getElementById('sku_name').value.trim();
  if (!name) { alert('SKU 名称不能为空'); return; }
  const code = document.getElementById('sku_code').value.trim(), id = 'sku_' + uid();
  state.skus.push({ id, name, code });
  state.versions[id] = ['V1.0'];
  state.activeVersions[id] = 'V1.0';
  state.cards[`${id}::V1.0`] = [];
  saveState(); closeSkuModal(); render();
}

// ════════════════════════════════════════════════════════
// 导入 / 导出
// ════════════════════════════════════════════════════════
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = '门锁需求看板数据.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.skus || !data.cards) { alert('文件格式不正确'); return; }
        if (!confirm('导入后将覆盖当前所有数据，确认继续？')) return;
        localStorage.setItem(STORAGE_KEY, ev.target.result);
        state = JSON.parse(ev.target.result);
        render(); alert('导入成功！');
      } catch(err) { alert('解析失败：' + err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ════════════════════════════════════════════════════════
// 键盘快捷键
// ════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCardModal(); closeSkuModal(); closeVerDateModal(); }
  if (e.key === 'Enter' && e.metaKey) {
    if (!document.getElementById('cardOverlay').classList.contains('hidden'))    saveCard();
    if (!document.getElementById('skuOverlay').classList.contains('hidden'))     saveSku();
    if (!document.getElementById('verDateOverlay').classList.contains('hidden')) saveVerDate();
  }
});
document.getElementById('cardOverlay').addEventListener('click',    e => { if (e.target === e.currentTarget) closeCardModal();    });
document.getElementById('skuOverlay').addEventListener('click',     e => { if (e.target === e.currentTarget) closeSkuModal();     });
document.getElementById('verDateOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeVerDateModal(); });

// ════════════════════════════════════════════════════════
// 启动
// ════════════════════════════════════════════════════════
renderLauncher(LAUNCHER_PROJECTS);
</script>
</body>
</html>
